<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="970" viewBox="0 0 1340 970">
<rect width="1340" height="970" fill="white"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<text x="30" y="30" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" font-style="normal" fill="#222" text-anchor="start">compute_buoyancy(Tg, grid, cfg, mat, phase_id, C_comp)   physics/compute_buoyancy.jl</text>
<text x="30" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">inputs per cell: temperature T, depth z, projected composition C_dep, C_pile, C_bas, C_cont; ⟨·⟩_r is the mean over the row at radius r</text>
<text x="858.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#222" text-anchor="start">plume cell (734 km)</text>
<text x="858.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">+200 K, pile 0.2</text>
<text x="1093.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#222" text-anchor="start">drip cell (147 km)</text>
<text x="1093.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">-150 K, basalt 0.6, C_dep 0.15</text>
<rect x="30" y="120" width="790" height="74" rx="8" fill="#fbdcdc" stroke="#c0392b" stroke-width="1.6"/>
<text x="42" y="141" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#c0392b" text-anchor="start">1  Thermal (lateral anomaly)</text>
<text x="42" y="164" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">δρ_T = −ρ0 α (T − ⟨T⟩_r)</text>
<text x="42" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">ρ0 = 3300 kg/m<tspan baseline-shift="super" font-size="10">3</tspan>, α = 3.0×10<tspan baseline-shift="super" font-size="10">-5</tspan> K<tspan baseline-shift="super" font-size="10">-1</tspan>; under ALA/TALA the driver swaps in ρ_ref(r) α(r) [(T − T_ad) − ⟨T − T_ad⟩_r]</text>
<rect x="854.0" y="134" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c0392b" text-anchor="start">T − ⟨T⟩ = +175 K:  -17.3 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="134" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c0392b" text-anchor="start">T − ⟨T⟩ = -131 K:  +13.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="194" x2="425.0" y2="208" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="210" width="790" height="74" rx="8" fill="#e8e8e8" stroke="#555555" stroke-width="1.6"/>
<text x="42" y="231" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start">2  Lithostatic pressure</text>
<text x="42" y="254" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">P = mantle_pressure(z)</text>
<text x="42" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">one hydrostat for the whole code (integrates the reference density under ALA)</text>
<rect x="854.0" y="224" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">z = 734 km:  P = 25.6 GPa</text>
<rect x="1089.0" y="224" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">z = 147 km:  P = 4.8 GPa</text>
<line x1="425.0" y1="284" x2="425.0" y2="298" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="300" width="790" height="74" rx="8" fill="#d7e5f5" stroke="#1f66bf" stroke-width="1.6"/>
<text x="42" y="321" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">3  Clapeyron 410 / 660 (cfg.useClaperonBuoyancy)</text>
<text x="42" y="344" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">Γ = ½[1 + tanh((P − P_t − γ (T − T_r)) / δP)],  δρ = Δρ (Γ − ⟨Γ⟩_r)</text>
<text x="42" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">γ = +2.5 / −2.5 MPa/K, Δρ = 180 / 400 kg/m<tspan baseline-shift="super" font-size="10">3</tspan>, δP660 = 1.15 GPa (3 cells at each transition's depth); P_t + compClapeyron_dP·C_bas (0); default off</text>
<rect x="854.0" y="314" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">Γ660 0.43 vs ⟨0.27⟩:  +66.7 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="314" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">Γ660 0.00 vs ⟨0.00⟩:  0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="374" x2="425.0" y2="388" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="390" width="790" height="74" rx="8" fill="#d7e5f5" stroke="#1f66bf" stroke-width="1.6"/>
<text x="42" y="411" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">4  Other phase steps (cfg.usePhaseTransitionDensity)</text>
<text x="42" y="434" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">same smooth Γ for 520 km (and ppv); 410/660 here only if step 3 is off</text>
<text x="42" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">γ520 = 4 MPa/K, Δρ520 = 100 kg/m<tspan baseline-shift="super" font-size="10">3</tspan>; needs phase_id, i.e. cfg.useMeltingPhase (default off)</text>
<rect x="854.0" y="404" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">Γ520 = 1.00:  0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="404" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">Γ520 = 0.00:  0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="464" x2="425.0" y2="478" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="480" width="790" height="74" rx="8" fill="#d9efe0" stroke="#2e9a59" stroke-width="1.6"/>
<text x="42" y="501" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#2e9a59" text-anchor="start">5  Depleted residue</text>
<text x="42" y="524" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">δρ_dep = −Δρ_dep · min(C_dep / F_max, 1)</text>
<text x="42" y="544" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">Δρ_dep = 50 kg/m<tspan baseline-shift="super" font-size="10">3</tspan> at the full residue, F_max = 0.3</text>
<rect x="854.0" y="494" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">C_dep 0.00:  0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="494" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#2e9a59" text-anchor="start">C_dep 0.15:  -25.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="554" x2="425.0" y2="568" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="570" width="790" height="74" rx="8" fill="#fbe3d2" stroke="#c05a14" stroke-width="1.6"/>
<text x="42" y="591" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#c05a14" text-anchor="start">6  Thermochemical pile</text>
<text x="42" y="614" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">δρ_pile = Δρ_pile (C_pile − ⟨C_pile⟩_r)</text>
<text x="42" y="634" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">Δρ_pile = mat.tcpile_drho = 50 kg/m<tspan baseline-shift="super" font-size="10">3</tspan>; piles tracked when cfg.useThermochemicalPiles</text>
<rect x="854.0" y="584" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c05a14" text-anchor="start">+8.8 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="584" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="644" x2="425.0" y2="658" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="660" width="790" height="74" rx="8" fill="#fbe3d2" stroke="#c05a14" stroke-width="1.6"/>
<text x="42" y="681" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#c05a14" text-anchor="start">7  Basalt → eclogite</text>
<text x="42" y="704" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">δρ_ecl = Δρ_ecl · C_bas · f_ecl,   f_ecl = clamp((z − z_e) / 20 km, 0, 1)</text>
<text x="42" y="724" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">Δρ_ecl = 200 kg/m<tspan baseline-shift="super" font-size="10">3</tspan>, z_e = 60 km; cfg.useEclogiteKinetics keeps cold shallow eclogite</text>
<rect x="854.0" y="674" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">f_ecl 1:  0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="674" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#c05a14" text-anchor="start">f_ecl 1:  +120.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="734" x2="425.0" y2="748" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="750" width="790" height="74" rx="8" fill="#eadff2" stroke="#8c4da6" stroke-width="1.6"/>
<text x="42" y="771" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#8c4da6" text-anchor="start">8  Crust (2-D only)</text>
<text x="42" y="794" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">δρ_crust = −Δρ_crust · clamp(C_cont + C_bas (1 − f_ecl), 0, 1)</text>
<text x="42" y="814" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">Δρ_crust = cfg.crustDensityAnomaly = 0 by default, so shallow basalt is neutral</text>
<rect x="854.0" y="764" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="764" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">0.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<line x1="425.0" y1="824" x2="425.0" y2="838" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="840" width="790" height="74" rx="8" fill="#eeeeee" stroke="#222222" stroke-width="1.6"/>
<text x="42" y="861" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">9  Sum and body force</text>
<text x="42" y="884" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">b = −g (δρ_T + δρ_Clap + δρ_phase + δρ_C)</text>
<text x="42" y="904" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">g = 9.81 m/s<tspan baseline-shift="super" font-size="10">2</tspan>; positive b points outward, so light material rises</text>
<rect x="854.0" y="854" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="882.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">+58.1 kg/m<tspan baseline-shift="super" font-size="10">3</tspan> → b = -570 N/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
<rect x="1089.0" y="854" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="882.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">+108.0 kg/m<tspan baseline-shift="super" font-size="10">3</tspan> → b = -1059 N/m<tspan baseline-shift="super" font-size="10">3</tspan></text>
</svg>
