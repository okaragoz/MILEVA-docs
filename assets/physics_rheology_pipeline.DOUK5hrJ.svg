<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="880" viewBox="0 0 1340 880">
<rect width="1340" height="880" fill="white"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<text x="30" y="30" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" font-style="normal" fill="#222" text-anchor="start">composite_rheology(T, P, ε̇_II, r, d, mat, cfg, C)   physics/composite_rheology.jl</text>
<text x="30" y="56" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">inputs per cell: temperature T, lithostatic pressure P, strain-rate invariant ε̇_II, grain size d, composition C</text>
<text x="858.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#222" text-anchor="start">lithosphere cell</text>
<text x="858.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">T 1000 K, P 1 GPa, ε̇ 1.0×10<tspan baseline-shift="super" font-size="10">-14</tspan> s<tspan baseline-shift="super" font-size="10">-1</tspan></text>
<text x="1093.0" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#222" text-anchor="start">mantle cell</text>
<text x="1093.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#444" text-anchor="start">T 1600 K, P 5 GPa, ε̇ 1.0×10<tspan baseline-shift="super" font-size="10">-15</tspan> s<tspan baseline-shift="super" font-size="10">-1</tspan></text>
<rect x="30" y="120" width="790" height="74" rx="8" fill="#d7e5f5" stroke="#1f66bf" stroke-width="1.6"/>
<text x="42" y="141" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">1  Diffusion creep</text>
<text x="42" y="164" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">η_diff = η0 · (d/d_ref)^m · exp[ E (1/T − 1/T_ref)/R + P V/(R T) ]</text>
<text x="42" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">η0 = 1.0×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s, E = 300 kJ/mol, V = 6.0 cm³/mol, T_ref = 1600 K</text>
<rect x="854.0" y="134" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">1.5×10<tspan baseline-shift="super" font-size="10">27</tspan> Pa s</text>
<rect x="1089.0" y="134" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">9.5×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s</text>
<line x1="425.0" y1="194" x2="425.0" y2="208" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="210" width="790" height="74" rx="8" fill="#d7e5f5" stroke="#1f66bf" stroke-width="1.6"/>
<text x="42" y="231" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">2  Dislocation creep</text>
<text x="42" y="254" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">η_disl = η0 · (ε̇_II/ε̇_ref)^((1−n)/n) · exp{ [E (1/T − 1/T_ref)/R + P V/(R T)] / n }</text>
<text x="42" y="274" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">η0 = 1.0×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s, n = 3.5, ε̇_ref = 1.0×10<tspan baseline-shift="super" font-size="10">-15</tspan> s⁻¹, E = 540 kJ/mol</text>
<rect x="854.0" y="224" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">3.3×10<tspan baseline-shift="super" font-size="10">23</tspan> Pa s</text>
<rect x="1089.0" y="224" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">4.5×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s</text>
<line x1="425.0" y1="284" x2="425.0" y2="298" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="300" width="790" height="74" rx="8" fill="#d7e5f5" stroke="#1f66bf" stroke-width="1.6"/>
<text x="42" y="321" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">3  Ductile viscosity (harmonic sum)</text>
<text x="42" y="344" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">η_duct = ( 1/η_diff + 1/η_disl [+ 1/η_GBS + 1/η_Peierls] )⁻¹</text>
<text x="42" y="364" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">the weaker mechanism dominates; GBS and Peierls join when switched on</text>
<rect x="854.0" y="314" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">3.3×10<tspan baseline-shift="super" font-size="10">23</tspan> Pa s</text>
<rect x="1089.0" y="314" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="342.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1f66bf" text-anchor="start">3.1×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s</text>
<line x1="425.0" y1="374" x2="425.0" y2="388" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="390" width="790" height="74" rx="8" fill="#fbe3d2" stroke="#c05a14" stroke-width="1.6"/>
<text x="42" y="411" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#c05a14" text-anchor="start">4  Composition factors</text>
<text x="42" y="434" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">η_duct × ξ(depletion) × b(basalt) × p(pile)</text>
<text x="42" y="454" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">all 1 for these cells (no residue, basalt or pile)</text>
<rect x="854.0" y="404" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">3.3×10<tspan baseline-shift="super" font-size="10">23</tspan> Pa s</text>
<rect x="1089.0" y="404" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="432.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">3.1×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s</text>
<line x1="425.0" y1="464" x2="425.0" y2="478" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="480" width="790" height="74" rx="8" fill="#eadff2" stroke="#8c4da6" stroke-width="1.6"/>
<text x="42" y="501" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#8c4da6" text-anchor="start">5  Drucker–Prager yield</text>
<text x="42" y="524" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">τ_y = min(C + μ P, τ_max),   η_y = τ_y / (2 ε̇_II)</text>
<text x="42" y="544" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">C = 20 MPa, μ = 0.2, τ_max = 300 MPa</text>
<rect x="854.0" y="494" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">τ_y = 220 MPa,  η_y = 1.1×10<tspan baseline-shift="super" font-size="10">22</tspan> Pa s</text>
<rect x="1089.0" y="494" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">τ_y = 300 MPa,  η_y = 1.5×10<tspan baseline-shift="super" font-size="10">23</tspan> Pa s</text>
<line x1="425.0" y1="554" x2="425.0" y2="568" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="570" width="790" height="74" rx="8" fill="#eadff2" stroke="#8c4da6" stroke-width="1.6"/>
<text x="42" y="591" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#8c4da6" text-anchor="start">6  Combination</text>
<text x="42" y="614" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">η = min(η_duct, η_y)      (cfg.viscosityCombination = "min")</text>
<text x="42" y="634" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">a cell yields where the yield viscosity is the smaller</text>
<rect x="854.0" y="584" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#8c4da6" text-anchor="start">1.1×10<tspan baseline-shift="super" font-size="10">22</tspan> Pa s  → yields</text>
<rect x="1089.0" y="584" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="612.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">3.1×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s  → creeps</text>
<line x1="425.0" y1="644" x2="425.0" y2="658" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="660" width="790" height="74" rx="8" fill="#d9efe0" stroke="#2e9a59" stroke-width="1.6"/>
<text x="42" y="681" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#2e9a59" text-anchor="start">7  Bounds</text>
<text x="42" y="704" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">η = clamp(η, η_min, η_max)</text>
<text x="42" y="724" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">η_min = 1.0×10<tspan baseline-shift="super" font-size="10">18</tspan>, η_max = 1.0×10<tspan baseline-shift="super" font-size="10">24</tspan> Pa s</text>
<rect x="854.0" y="674" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">1.1×10<tspan baseline-shift="super" font-size="10">22</tspan> Pa s</text>
<rect x="1089.0" y="674" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="702.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">3.1×10<tspan baseline-shift="super" font-size="10">21</tspan> Pa s</text>
<line x1="425.0" y1="734" x2="425.0" y2="748" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="750" width="790" height="74" rx="8" fill="#eeeeee" stroke="#555555" stroke-width="1.6"/>
<text x="42" y="771" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start">8  Smoothing (grid)</text>
<text x="42" y="794" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">log η̃ = (1 − 2w_θ − 2w_r) log η + w_θ Σ_θ log η + w_r Σ_r log η</text>
<text x="42" y="814" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#555" text-anchor="start">neighbours in θ and r, w_θ = 0.08, w_r = 0.04; a convex combination in log η, bounds preserved</text>
<rect x="854.0" y="764" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="862.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">acts on the whole field</text>
<rect x="1089.0" y="764" width="223.0" height="46" rx="6" fill="#fafafa" stroke="#ccc"/>
<text x="1097.0" y="792.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#222" text-anchor="start">acts on the whole field</text>
</svg>
